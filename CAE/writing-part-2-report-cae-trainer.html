<script>
const originalReport = [
  ['Introduction', '[[p:The aim of this report is to]] evaluate the peer mentoring scheme introduced last term and suggest improvements for the next intake. [[p:The report is based on]] a survey of first-year students and follow-up interviews with six mentors.'],
  ['Benefits', '[[p:The scheme was]] [[a:particularly]] beneficial to students who were unfamiliar with the campus. Mentors showed them how to [[r:access course materials]] and book appointments with tutors. [[p:The support was]] [[a:especially]] helpful in the first fortnight, when students had several deadlines to meet. [[p:An unexpected benefit was]] [[r:the development of closer links]] between students from different courses. These links offered intangible benefits, including a stronger sense of belonging.'],
  ['Drawbacks', '[[p:The principal drawback was that]] the weekly meetings often [[d:clashed with afternoon classes]]. Rescheduling them [[d:necessitated additional work]] for the coordinator and was inconvenient for mentors with part-time jobs. The survey also suggests that some mentors were not [[a:sufficiently]] well informed about the support available for students experiencing academic difficulties.'],
  ['Recommendations', '[[p:In light of the survey results]], [[p:I would strongly recommend that]] the college [[r:offer two meeting slots each week]]. [[p:This would allow]] students to attend without missing classes. The scheme could be made [[a:significantly]] more cost-effective by replacing printed guidance with a short online briefing. A brief follow-up survey should be conducted [[p:to determine whether]] the revised schedule has improved attendance. Overall, the scheme should continue, provided that mentors receive clearer guidance before the next intake.']
];
const phrases = [
  ['The aim of this report __ to evaluate the scheme.', 'is', 'has', 'does'],
  ['The report is based __ a survey of new students.', 'on', 'from', 'by'],
  ['An unexpected __ of the scheme was that students felt a stronger sense of belonging.', 'benefit', 'drawback', 'target'],
  ['The principal __ was that meetings clashed with classes.', 'drawback', 'outcome', 'insight'],
  ['In __ of the survey results, I would suggest a change.', 'light', 'viewing', 'terms'],
  ['This would __ students to attend without missing classes.', 'allow', 'let', 'let to'],
  ['I would advise __ moving all meetings online.', 'against', 'from', 'about'],
  ['The scheme could be made more cost-effective __ replacing printed material.', 'by', 'with', 'for']
];
const originalSynonyms = [
 ['Rescheduling the meetings <b>necessitated</b> additional work.', 'made necessary', 'made optional', 'made easier'],
 ['The timing was <b>inconvenient</b> for mentors with part-time jobs.', 'difficult to fit into their schedules', 'unlikely to affect their schedules', 'chosen to suit their schedules'],
 ['The scheme offered several <b>intangible</b> benefits.', 'difficult to measure directly', 'impossible to achieve', 'likely to disappear'],
 ['Some mentors were <b>well informed</b> about the available support.', 'familiar with the relevant facts', 'satisfied with the support', 'responsible for providing support'],
 ['A follow-up survey could <b>determine</b> whether attendance had improved.', 'establish', 'assume', 'announce'],
 ['Running two sessions would <b>entail</b> extra work.', 'involve', 'prevent', 'reduce']
];
const originalJumbles = [
 ['The aim of this report|is to|evaluate|the mentoring scheme'],
 ['The report|is based on|a survey|of first-year students'],
 ['The scheme|was particularly beneficial|to students|who were unfamiliar with the campus'],
 ['An unexpected benefit|was|the development|of closer links between students'],
 ['The principal drawback|was that|the weekly meetings|often clashed with afternoon classes'],
 ['Rescheduling the meetings|necessitated|additional work|for the coordinator'],
 ['I would strongly recommend|that the college|offer two meeting slots|each week'],
 ['A brief follow-up survey|should be conducted|to determine|whether attendance has improved']
];
const normalise = s => s.trim().toLowerCase().replace(/[.,!?]+$/, '').replace(/\s+/g,' ');
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(answer, type, extra = '') {
  return '<input autocomplete="off" spellcheck="false" class="'+type+'" aria-label="'+type+' answer" data-answer="'+esc(answer)+'" '+extra+'>';
}
function spoiler(answer, label, masked = '••••••') {
  return '<button type="button" class="spoiler" aria-pressed="false" aria-label="'+label+
    '" data-reveal="'+esc(answer)+'" data-mask="'+masked+'">'+masked+'</button>';
}
function scramble(word) {
  const letters = [...word];
  for (let i = letters.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [letters[i], letters[j]] = [letters[j], letters[i]];
  }
  const result = letters.join('');
  return result === word ? word.slice(1) + word[0] : result;
}
function renderReport(report, mode) {
  return report.map(([title, paragraph]) => {
    let phraseNumber = 0;
    const content = paragraph.replace(/\[\[([pard]):(.*?)\]\]/g, (_, kind, word) => {
      if (mode === 'recall-easy' || mode === 'recall-hard') {
        const hide = mode === 'recall-hard' || kind === 'a' || kind === 'd' ||
          (kind === 'p' && phraseNumber++ % 2 === 0);
        return hide ? spoiler(word, 'Reveal missing text') : word;
      }
      if (kind === 'r' || kind === 'd') return word;
      if (mode === 'phrase') return kind === 'p'
        ? '<button type="button" class="drop" data-answer="'+esc(word)+'" aria-label="Report phrase gap">Drop phrase</button>'
        : '<span class="skip">____</span>';
      if (mode === 'adverb' && kind === 'a') {
        return field(word,'adverb','placeholder="'+word[0]+'…"')+' '+
          spoiler('('+scramble(word)+')','Reveal scrambled letters','(••••••)');
      }
      return word;
    });
    return '<h3>'+title+'</h3><p>'+content+'</p>';
  }).join('');
}
const distractors = {
  'necessitated':['prevented','anticipated'],
  'inconvenient':['manageable','irrelevant'],
  'intangible':['temporary','measurable'],
  'well informed':['well prepared','well connected'],
  'determine':['predict','assume'],
  'entail':['avoid','reduce'],
  'particularly effective':['barely relevant','unexpectedly difficult'],
  'more readily':['more accurately','more cautiously'],
  'ascertain':['assume','overlook'],
  'entailed':['prevented','shortened'],
  'substantially':['slightly','temporarily'],
  'unexpected benefit':['stated objective','unresolved issue'],
  'cost-effective':['time-consuming','labour-intensive'],
  'principal drawback':['original purpose','preferred solution']
};
function targetWordQuestion([sentence, definition]) {
  const target = sentence.match(/<b>(.*?)<\/b>/)[1];
  const clue = target === 'necessitated' ? 'made it necessary to do' : definition;
  const prompt = sentence.replace(/<b>.*?<\/b>/,'<strong>__</strong>')+' <em>('+esc(clue)+')</em>';
  return choice(prompt,target,...distractors[target]);
}
function choice(text, correct, ...options) {
  const answers = Array.isArray(correct) ? correct : [correct];
  const choices = [...answers,...options].sort((a,b)=>a.localeCompare(b));
  return '<li><label>'+text+' <select data-answer="'+esc(answers.join('|'))+'"><option value="">Choose</option>'+choices.map(item=>'<option>'+esc(item)+'</option>').join('')+'</select></label></li>';
}
function tile(label, attrs = '') {
  return '<button type="button" class="tile" '+attrs+'>'+esc(label)+'</button>';
}
function sentenceExercise([line], index) {
  const chunks = line.split('|');
  const order = index % 2 ? [2,0,3,1] : [3,1,0,2];
  return '<li class="jumble"><div class="chunk-list">'+
    order.map(i=>tile(chunks[i], 'data-chunk="'+i+'"')).join('')+
    '</div><div class="assembled" aria-label="Your sentence" data-answer="'+esc(chunks.join(' '))+'"></div></li>';
}
function makeJumbles(report) {
  return report.flatMap(([, paragraph]) => paragraph
    .replace(/\[\[[pard]:(.*?)\]\]/g, '$1')
    .match(/[^.]+\./g).slice(0,2).map(sentence => {
      const words = sentence.trim().replace(/\.$/,'').split(/\s+/);
      return [Array.from({length:4}, (_, i) =>
        words.slice(Math.floor(i*words.length/4), Math.floor((i+1)*words.length/4)).join(' ')
      ).join('|')];
    }));
}
function mount(panel, item, index) {
const {report, synonyms, prompt} = item;
const jumbles = index === 0 ? originalJumbles : makeJumbles(report);
const taskPhrases = index === 0 ? phrases : phraseQuestions(report);
panel.querySelector('.prompt').textContent = prompt + ' Write 220–260 words.';
const phraseBank = report.flatMap(([,paragraph]) =>
  [...paragraph.matchAll(/\[\[p:(.*?)\]\]/g)].map(match => match[1])
).sort();
const activities = [
 ['1','Report phrases','Choose the missing word to complete each phrase.', '<ol>'+taskPhrases.map(row=>choice(...row)).join('')+'</ol>'],
 ['2','Complete the model report','Drag a phrase into a gap, or select a phrase and then click its gap. Click a filled gap to return its phrase. Skip the shaded adverb gaps.', '<div class="report-layout"><div class="bank">'+phraseBank.map((phrase,index)=>tile(phrase,'draggable="true" data-phrase="'+index+'" aria-pressed="false"')).join('')+'</div><div class="report-text">'+renderReport(report,'phrase')+'</div></div>'],
 ['3','Missing words','Type the whole adverb, including the first letter. Click the dots for scrambled letters if you need a hint.',renderReport(report,'adverb')],
 ['4','Find the target word','Use the clue at the end to recall the word aloud. Then choose it from the list.','<ol class="synonyms">'+synonyms.map(targetWordQuestion).join('')+'</ol>'],
 ['5','Unjumble the sentences','Click the chunks in order. Click a chunk in your sentence to return it and change the order.','<ol>'+jumbles.map(sentenceExercise).join('')+'</ol>'],
 ['6','Recall aloud','Read the report aloud and reconstruct the missing phrases and adverbs from memory.', '<div class="recall-controls"><button type="button" data-level="easy" aria-pressed="true">1 · Fewer gaps</button><button type="button" data-level="hard" aria-pressed="false">2 · More gaps</button></div><div class="recall-text">'+renderReport(report,'recall-easy')+'</div>' ]
];
panel.querySelector('.exercise-nav').innerHTML=activities.map(([n,title])=>'<a href="#task-'+index+'-'+n+'">'+n+'. '+title+'</a>').join('');
panel.querySelector('.exercises').innerHTML=activities.map(([n,title,instruction,body])=>'<section id="task-'+index+'-'+n+'"><h2>'+n+'. '+title+'</h2><p>'+instruction+'</p>'+body+(n==='6'?'':'<button type="button" class="check">Check answers</button><span role="status"></span>')+'</section>').join('');
panel.querySelector('.model').innerHTML=renderReport(report,'model');
for (const section of panel.querySelectorAll('section')) {
  const button=section.querySelector('.check');
  if (!button) continue;
  const fields=[...section.querySelectorAll('[data-answer]')];
  button.addEventListener('click',()=>{
    let correct=0, blank=0;
    for(const input of fields){
      const value=normalise(input.dataset.value ?? (input.matches("input, select") ? input.value : ""));
      const matches=input.dataset.answer.split('|').some(answer=>normalise(answer)===value);
      correct+=Number(matches);
      blank+=Number(!value);
      input.classList.toggle('right',matches);
      input.classList.toggle('wrong',Boolean(value)&&!matches);
      if (input.matches('.drop') && value) {
        input.setAttribute('aria-label',input.dataset.value+(matches ? ', correct' : ', incorrect'));
      }
    }
    section.querySelector('[role=status]').textContent=correct+' of '+fields.length+' correct.'+(blank?' '+blank+' left blank.':'');
  });
  section.addEventListener('input',event=>{
    event.target.classList.remove('right','wrong');
    section.querySelector('[role=status]').textContent='';
  });
}
panel.addEventListener('click', event => {
  const hint = event.target.closest('.spoiler');
  if (hint) {
    const reveal = hint.getAttribute('aria-pressed') === 'false';
    hint.setAttribute('aria-pressed',String(reveal));
    hint.textContent = reveal ? hint.dataset.reveal : hint.dataset.mask;
  }
  const level = event.target.closest('[data-level]');
  if (level) {
    for (const button of panel.querySelectorAll('[data-level]')) {
      button.setAttribute('aria-pressed', String(button === level));
    }
    panel.querySelector('.recall-text').innerHTML = renderReport(report,'recall-'+level.dataset.level);
  }
});
const bank = panel.querySelector('.bank');
const bankTiles = [...bank.querySelectorAll('.tile')];
let selected = null;
function selectPhrase(index) {
  selected = index;
  for (const tile of bankTiles) tile.setAttribute('aria-pressed', String(tile.dataset.phrase === index));
}
function clearFeedback(element) {
  element.classList.remove('right','wrong');
  element.closest('section').querySelector('[role=status]').textContent='';
}
function returnPhrase(gap) {
  if (gap.dataset.phrase === undefined) return;
  bankTiles[Number(gap.dataset.phrase)].disabled = false;
  delete gap.dataset.phrase;
  delete gap.dataset.value;
  gap.textContent = 'Drop phrase';
  gap.setAttribute('aria-label','Report phrase gap');
  clearFeedback(gap);
}
function placePhrase(gap, index) {
  const tile = bankTiles[Number(index)];
  if (index === '' || index === null || !tile || tile.disabled) return;
  returnPhrase(gap);
  tile.disabled = true;
  gap.dataset.phrase = index;
  gap.dataset.value = tile.textContent;
  gap.textContent = tile.textContent;
  gap.setAttribute('aria-label',tile.textContent);
  selectPhrase(null);
  clearFeedback(gap);
}
for (const tile of bankTiles) {
  tile.addEventListener('click',()=>selectPhrase(selected === tile.dataset.phrase ? null : tile.dataset.phrase));
  tile.addEventListener('dragstart',event=>{
    event.dataTransfer.effectAllowed = 'move';
    event.dataTransfer.setData('application/x-report-phrase',tile.dataset.phrase);
  });
}
for (const gap of panel.querySelectorAll('.drop')) {
  gap.addEventListener('click',()=>selected === null ? returnPhrase(gap) : placePhrase(gap,selected));
  gap.addEventListener('dragover',event=>{
    if (!event.dataTransfer.types.includes('application/x-report-phrase')) return;
    event.preventDefault();
    gap.classList.add('over');
  });
  gap.addEventListener('dragleave',()=>gap.classList.remove('over'));
  gap.addEventListener('drop',event=>{
    event.preventDefault();
    gap.classList.remove('over');
    placePhrase(gap,event.dataTransfer.getData('application/x-report-phrase'));
  });
}
for (const row of panel.querySelectorAll('.jumble')) {
  const source = row.querySelector('.chunk-list');
  const assembled = row.querySelector('.assembled');
  const chunks = [...source.children];
  row.addEventListener('click',event=>{
    const tile = event.target.closest('[data-chunk]');
    if (!tile) return;
    if (tile.parentElement === source) assembled.append(tile);
    else {
      const next = chunks.slice(chunks.indexOf(tile)+1).find(chunk=>chunk.parentElement === source);
      source.insertBefore(tile,next || null);
    }
    assembled.dataset.value = [...assembled.children].map(chunk=>chunk.textContent).join(' ');
    clearFeedback(assembled);
  });
}

}
function phraseQuestions(report) {
  const text = report.map(([,paragraph]) => paragraph.replace(/\[\[[pard]:(.*?)\]\]/g,'$1')).join(' ');
  const patterns = [
    ['report is to', 'to', 'for', 'by'],
    ['aims to', 'to', 'for', 'with'],
    ['based on', 'on', 'at', 'from'],
    ['draws on', 'on', 'through', 'into'],
    ['unexpected benefit', 'benefit', 'cost', 'risk'],
    ['in light of', 'light', 'viewing', 'terms'],
    ['would allow', 'allow', 'let', 'have'],
    ['also suggest', 'suggest', 'offer', 'invite'],
    ['drawback was that', 'that', 'of', 'as']
  ];
  return patterns.flatMap(([pattern,answer,...choices]) => {
    const sentence = text.match(/[^.]+\./g).find(line => line.toLowerCase().includes(pattern));
    if (!sentence) return [];
    const start = sentence.toLowerCase().indexOf(pattern);
    const target = start + pattern.lastIndexOf(answer);
    return [[(sentence.slice(0,target)+'__'+sentence.slice(target+answer.length)).trim(),answer,...choices]];
  });
}
const reports = [{title:"Peer mentoring",prompt:"Your college has piloted a peer mentoring scheme for new students. The principal has asked you to evaluate its benefits, identify a problem and recommend changes for the next intake.",report:originalReport,synonyms:originalSynonyms}, ...[{"title": "Digital skills programme", "prompt": "Your college has introduced a digital skills programme. The programme director has asked you to report on how effectively it prepared students for independent study, explain a weakness and recommend changes for the next term.", "report": [["Introduction", "[[p:The purpose of this report is to]] evaluate the six-week digital skills programme and recommend changes for next term. [[p:The report is based on]] learner feedback and a comparison of the tasks students completed before and after the programme."], ["Benefits", "[[p:The workshops were]] [[a:particularly]] effective in helping students assess online sources. At the beginning, many relied on the first search result they found. By the final session, most were comparing sources and [[r:checking publication dates]]. [[p:An unexpected benefit was]] that students began sharing reliable resources with classmates. This was [[a:especially]] helpful for those returning to education after a long break."], ["Drawbacks", "[[p:The principal drawback was that]] the last bus to [[d:the outlying villages]] left before the evening practice session ended. This made the final practice session inconvenient for some students, who had to [[d:arrange alternative transport]]. The programme also assumed that everyone was [[a:sufficiently]] familiar with spreadsheet software. Several students said that the pace of the opening session was disruptive to their learning because they could not pause to practise."], ["Recommendations", "[[p:In light of these findings]], I would strongly recommend offering two practice sessions at different times. [[p:This would allow]] students to choose a slot that fits their tra const tabs = document.querySelector('#report-nav');
const panels = document.querySelector('#panels');
const template = document.querySelector('#report-panel');
const mounted = new Map();
function showReport(index) {
  if (!mounted.has(index)) {
    const panel = document.createElement('article');
    panel.append(template.content.cloneNode(true));
    panels.append(panel);
    mount(panel,reports[index],index);
    mounted.set(index,panel);
  }
  for (const [key,panel] of mounted) panel.hidden = key !== index;
  [...tabs.children].forEach((tab,i)=>tab.setAttribute('aria-pressed',String(i===index)));
}
reports.forEach(({title},index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = (index+1)+'. '+title;
  button.addEventListener('click',()=>showReport(index));
  tabs.append(button);
});
showReport(0);
