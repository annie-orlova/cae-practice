<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Present and Future Conditionals</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3ef;color:#182c27;font:17px/1.55 system-ui,sans-serif}main{max-width:900px;margin:7vh auto;padding:0 20px}h1{font-size:clamp(28px,5vw,42px);line-height:1.1;margin:10px 0 24px}section{background:white;border:1px solid #cbd9d1;border-radius:18px;padding:clamp(18px,5vw,36px)}#progress{color:#426259;font-size:14px}h2{font-size:21px;margin:8px 0}#prompt{white-space:pre-line}input[type=text]{width:100%;padding:12px;border:1px solid #79948b;border-radius:8px;font:inherit}label{display:block;border:1px solid #cbd9d1;padding:9px 12px;margin:8px 0;border-radius:8px;cursor:pointer}input[type=radio]{margin-right:9px}button{font:inherit;padding:8px 14px;border:1px solid #1c584a;border-radius:8px;background:white;color:#1c584a;cursor:pointer}.primary{background:#1c584a;color:white}button:disabled{opacity:.5;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}#feedback:empty{display:none}#feedback{background:#eef3ef;padding:12px;border-radius:8px}li{margin-bottom:12px}[hidden]{display:none!important}

#sheet fieldset{border:0;border-bottom:1px solid #d9e5df;margin:0;padding:0 0 12px;min-width:0}
#sheet fieldset+fieldset{margin-top:16px}#sheet legend{font-weight:600;padding:0}
.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.choices label{margin:0}
.choices .correct{background:#e4f4e9;border-color:#1c584a}.choices .incorrect{background:#fcebea;border-color:#a74646}
.note{font-size:15px;margin:8px 0 0}.note:empty{display:none}
</style>
<style>
nav,.profile,.actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}nav{margin:12px 0}button[aria-pressed=true]{background:#1c584a;color:white}
.profile input{width:auto;max-width:100%}.profile p{flex-basis:100%;margin:0}
article{padding:16px 0;border-bottom:1px solid #d9e5df}article p{margin:0 0 8px}
article input[type=text]{max-width:440px}.note{margin-top:8px!important}
</style>
<main>
<h1>Present and Future Conditionals</h1>
<form class="profile" id="profile">
<label for="name">Local profile</label>
<input id="name" type="text" maxlength="50" required placeholder="Your name">
<button class="primary">Sign in</button>
<button type="button" id="sign-out" hidden>Sign out</button>
<p id="profile-status" role="status"></p>
</form>
<nav id="sets" aria-label="Sets"></nav>
<nav id="parts" aria-label="Parts"></nav>
<section id="sheet">
<h2 id="title" tabindex="-1"></h2>
<p id="directions"></p>
<form id="exercise">
<div id="items"></div>
<p id="result" role="status"></p>
<div class="actions"><button class="primary">Check answers</button><button type="button" id="clear">Clear this part</button></div>
</form>
</section>
</main>
<script>
"use strict";
const functions = ["Ordinary future condition","Expected result","Assumption based on what you’ve heard","Refusal","Polite request","Indirect question","Chance encounter","Tentative hypothetical situation","Imagining a situation without something","Tentative future possibility"];
// Each pattern supplies a function question, a form question and a transformation.
const patterns = [
 ([subject,verb,badPast,result]) => [
   `If ${subject} ${verb}, ${result}.`, `If ${subject} __, ${result}.`, [verb,`will ${badPast}`,`would ${badPast}`],
   `${result[0].toUpperCase()+result.slice(1)} on condition that ${subject} ${verb}.`, "PROVIDED", `${result[0].toUpperCase()+result.slice(1)} __ ${verb}.`, [`provided that ${subject}`]
 ],
 ([action,effect]) => [
   `I’ll ${action} if it’ll ${effect}.`, `I’ll ${action} if it __ ${effect}.`, ["will","would have","has"],
   `I’ll ${action} if doing so is going to ${effect}.`, "WILL", `I’ll ${action} __ ${effect}.`, ["if it will"]
 ],
 ([subject,detail,result]) => [
   `“${subject} won’t ${detail}.” “Well, if ${subject} won’t ${detail}, ${result}.”`, `“${subject} won’t ${detail}.” “Well, if ${subject} __ ${detail}, ${result}.”`, ["won’t","hasn’t","isn’t"],
   `If it’s true that ${subject} won’t ${detail}, ${result}.`, "CASE", `${subject} won’t ${detail}. If __, ${result}.`, ["that is the case","that’s the case"]
 ],
 ([who,action,result]) => [
   `If ${who} won’t ${action}, ${result}.`, `If ${who} __ ${action}, ${result}.`, ["won’t","isn’t","hasn’t"],
   `If ${who} refuse${who==="they"?"":"s"} to ${action}, ${result}.`, "WILL", `If __ ${action}, ${result}.`, [`${who} will not`]
 ],
 ([action,result]) => [
   `If you’ll just ${action}, ${result}.`, `If you __ just ${action}, ${result}.`, ["will","had","have"],
   `Please just ${action} and ${result}.`, "WILL", `__ just ${action}, ${result}.`, ["If you will","If you’ll"]
 ],
 ([subject,detail]) => [
   `I don’t know if ${subject} will ${detail}.`, `I don’t know if ${subject} __ ${detail}.`, ["will","has","is"],
   `Will ${subject} ${detail}? I don’t know.`, "WHETHER", `I don’t know __ ${detail}.`, [`whether ${subject} will`]
 ],
 ([action,result]) => [
   `If you happen to ${action}, ${result}.`, `If you __ ${action}, ${result}.`, ["happen to","happened","happen"],
   `If you ${action} by chance, ${result}.`, "HAPPEN", `__ ${action}, ${result}.`, ["If you happen to"]
 ],
 ([action,result]) => [
   `If I were to ${action}, ${result}`, `If I __ ${action}, ${result}`, ["were to","will to","had to have"],
   `If I were to ${action}, ${result}`, "WERE", `__ ${action}, ${result}`, ["Were I to"]
 ],
 ([factor,result]) => [
   `If it weren’t for ${factor}, ${result}.`, `If it __ ${factor}, ${result}.`, ["weren’t for","wouldn’t for","weren’t to"],
   `Without ${factor}, ${result}.`, "WERE", `If __ ${factor}, ${result}.`, ["it were not for","it weren’t for"]
 ],
 ([action,result]) => [
   `Should you need to ${action}, ${result}.`, `__ you need to ${action}, ${result}.`, ["Should","Had","Were"],
   `If you need to ${action}, ${result}.`, "SHOULD", `__ ${action}, ${result}.`, ["Should you need to"]
 ]
];
const sets = [
 [["the shop","opens tomorrow","open tomorrow","I’ll go"],["come over early","help"],["Peter","be there","it’s not worth going"],["they","give us a refund","we’ll make a formal complaint"],["sign here","I’ll give you a copy"],["the shop","be open tomorrow"],["see Tom","tell him I’ve got his keys"],["write a review of Lion","I’d praise the cinematography."],["my flexible hours","I wouldn’t be able to take evening classes"],["adjust the lesson time","please let me know"]],
 [["trainers","arrive early","arrive early","we’ll start the session sooner"],["swap shifts","make things easier"],["the course","go ahead","we’d better update the schedule now"],["they","amend the agreement","we’ll ask for a meeting"],["follow me","I’ll show you to your seat"],["the trainer","cover the report format"],["find my notebook","please bring it to class"],["amend the proposal","do you think we could find common ground?"],["the online recordings","I’d have to miss some sessions altogether"],["reschedule the follow-up interview","please email the coordinator"]],
 [["my students","finish early","finish early","we’ll play one more round"],["print the itinerary","save time at the airport"],["our guide","be available tomorrow","we’d better book a different tour"],["he","turn the music down","I’ll leave"],["wait outside","I’ll check whether the room is free"],["the library","stock that gripping mystery"],["come across a gripping memoir","send me the title"],["brush up on my German","which podcast would you recommend?"],["my cat","I’d have nobody to talk to at home"],["amend your booking","please contact reception"]],
 [["the organisers","approve the plan","approve the plan","we’ll announce the workshop"],["send you my notes","help you brush up on your presentation skills"],["prices","come down next month","let’s wait before buying"],["she","adjust the deadline","we’ll have to change the scope"],["take a seat","I’ll be with you shortly"],["the new software","make the materials more accessible"],["spot an error in the detailed itinerary","send me a message"],["recommend a moving biographical drama","I’d suggest Lion without hesitation."],["your support","I’d struggle to keep up with the training"],["request a copy of the report","please contact the office"]]
];
const questionSets = sets.map((set, setIndex) => set.map((data, type) => {
  const [sentence, blank, forms, original, key, rewrite, answers] = patterns[type](data);
  const order = (type + setIndex) % 3;
  const meanings = [functions[type], functions[(type+3)%10], functions[(type+6)%10]];
  const rotate = list => list.slice(3-order).concat(list.slice(0,3-order));
  return {sentence:sentence.replace(/\.([?])$/,"$1"), blank:blank.replace(/\.([?])$/,"$1"), forms:rotate(forms), meanings:rotate(meanings), correct:order, original:original.replace(/\.([?])$/,"$1"), key, rewrite:rewrite.replace(/\.([?])$/,"$1"), answers};
}));
const $ = id => document.getElementById(id);
const prefix = "present-continuous-cae-v1:";
let storageOK = true;
function read(key, fallback) {
  try { return JSON.parse(localStorage.getItem(prefix+key)) ?? fallback; }
  catch { storageOK = false; return fallback; }
}
function write(key,value) {
  try { localStorage.setItem(prefix+key, JSON.stringify(value)); }
  catch { storageOK = false; }
}
let profile = read("active","");
let state = profile ? read("profile:"+profile,{set:0,part:0,work:{}}) : {set:0,part:0,work:{}};
const partNames = ["Choose the function","Choose the correct form","Key word transformations"];
const directions = ["Choose the meaning of the if-clause in each sentence.","Choose the form that completes each sentence.","Complete the second sentence so it has the same meaning. Write 3 to 6 words, including the given word unchanged. Contractions count as two words."];
const normalize = value => value.toLowerCase().trim().replace(/[’‘]/g,"'").replace(/[.!?,]+$/,"").replace(/\s+/g," ");
const wordCount = value => normalize(value).split(" ").reduce((count, word) => count + (/n't$|'(?:m|re|ve|ll|d|s)$/.test(word) ? 2 : 1),0);

function profileStatus() {
  $("profile-status").textContent = storageOK ? (profile ? `Signed in as ${profile}. Progress saves in this browser.` : "Sign in with a name to save your progress in this browser.") : "Browser storage is unavailable. Progress lasts until you close or reload the page.";
  $("sign-out").hidden = !profile;
}
function save() {
  if (profile) write("profile:"+profile,state);
  profileStatus();
}
function tabBar(id,labels,current,select) {
  $(id).replaceChildren(...labels.map((label,index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    button.setAttribute("aria-pressed", index === current);
    button.onclick = () => { select(index); save(); render(); $("title").focus(); };
    return button;
  }));
}
function render() {
  const {set,part} = state;
  const work = state.work[`${set}:${part}`] ??= {answers:{},checked:false};
  tabBar("sets",sets.map((_,index)=>`Set ${index+1}`),set,index=>{state.set=index;});
  tabBar("parts",partNames.map((_,index)=>`Part ${index+1}`),part,index=>{state.part=index;});
  $("title").textContent = `Set ${set+1} · Part ${part+1} · ${partNames[part]}`;
  $("directions").textContent = directions[part];
  $("items").replaceChildren();
  const rows = questionSets[set].map((item,index) => {
    const row = document.createElement(part === 2 ? "article" : "fieldset");
    const heading = document.createElement(part === 2 ? "p" : "legend");
    row.append(heading);
    if (part === 2) {
      const key = document.createElement("strong");
      key.textContent = `(${item.key})`;
      heading.append(`${index+1}. ${item.original} `,key,document.createElement("br"),item.rewrite);
      const input = document.createElement("input");
      input.type = "text";
      input.autocomplete = "off";
      input.spellcheck = false;
      input.setAttribute("aria-label",`Answer ${index+1}`);
      input.value = work.answers[index] ?? "";
      input.oninput = () => update(index,input.value);
      row.append(input);
    } else {
      heading.textContent = `${index+1}. ${part === 0 ? item.sentence : item.blank}`;
      const choices = document.createElement("div");
      choices.className = "choices";
      (part === 0 ? item.meanings : item.forms).forEach((choice,position) => {
        const label = document.createElement("label");
        const input = document.createElement("input");
        input.type = "radio";
        input.name = `q-${index}`;
        input.checked = work.answers[index] === position;
        input.onchange = () => update(index,position);
        label.append(input,choice);
        choices.append(label);
      });
      row.append(choices);
    }
    const note = document.createElement("p");
    note.className = "note";
    row.append(note);
    $("items").append(row);
    return {row,note,item};
  });
  function update(index,value) {
    work.answers[index] = value;
    work.checked = false;
    showResults();
    save();
  }
  function showResults() {
    let score = 0;
    let answered = 0;
    rows.forEach(({row,note,item},index) => {
      note.textContent = "";
      const labels = row.querySelectorAll(".choices label");
      labels.forEach(label=>label.classList.remove("correct","incorrect"));
      const value = work.answers[index];
      if (!work.checked || value === undefined || value === "") return;
      if (part === 2) {
        if (!value.trim()) return;
        answered++;
        const count = wordCount(value);
        const hasKey = normalize(value).replace(/you'll/g,"you will").split(" ").includes(item.key.toLowerCase());
        const correct = count >= 3 && count <= 6 && item.answers.some(answer=>normalize(answer)===normalize(value));
        if (correct) score++;
        note.textContent = correct ? "Correct." : count < 3 || count > 6 ? "Use 3 to 6 words." : !hasKey ? `Use ${item.key} unchanged. Model answer: ${item.answers[0]}.` : `Model answer: ${item.answers[0]}.`;
      } else {
        answered++;
        labels[item.correct].classList.add("correct");
        if (value === item.correct) score++;
        else labels[value].classList.add("incorrect");
      }
    });
    $("result").textContent = work.checked ? `${score} / 10 correct · ${10-answered} unanswered` : "";
  }
  $("exercise").onsubmit = event => { event.preventDefault(); work.checked = true; showResults(); save(); };
  $("clear").onclick = () => { work.answers = {}; work.checked = false; save(); render(); };
  showResults();
}
$("profile").onsubmit = event => {
  event.preventDefault();
  const name = $("name").value.trim();
  if (!name) return;
  const previous = read("profile:"+name,null);
  state = previous ?? (profile ? {set:0,part:0,work:{}} : state);
  profile = name;
  write("active",profile);
  save();
  render();
};
$("sign-out").onclick = () => {
  profile = "";
  state = {set:0,part:0,work:{}};
  $("name").value = "";
  write("active","");
  profileStatus();
  render();
};
$("name").value = profile;
profileStatus();
render();
</script>
</html>
